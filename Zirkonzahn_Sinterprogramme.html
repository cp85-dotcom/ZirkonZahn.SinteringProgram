<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zirkonzahn.SinteringProgram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&family=Alegreya+SC:wght@400;700&family=Alegreya:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --title:#A3A3A3;
    --text:#FFFFFF;
    --hl:#96B200;
    --hl-soft:rgba(150,178,0,.16);
    --warn:#E0A63A;
    --warn-soft:rgba(224,166,58,.14);
    --card:#1C1C1E;
    --card-2:#2C2C2E;
    --card-3:#3A3A3C;
    --line:rgba(255,255,255,.10);
    --radius:22px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.65;letter-spacing:.05em;-webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;cursor:pointer;text-align:left}
  main{max-width:1080px;margin:0 auto;padding:48px 24px calc(80px + env(safe-area-inset-bottom))}
  .reveal{animation:in .5s var(--ease) both}
  .reveal-2{animation:in .5s var(--ease) .06s both}
  .reveal-3{animation:in .5s var(--ease) .12s both}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .still .reveal,.still .reveal-2,.still .reveal-3{animation:none}
  .opq-h{margin:16px 0 8px;font-size:12px;letter-spacing:.04em;color:var(--muted,#9a9a9a)}

  /* Stepper */
  .steps-nav{display:flex;gap:8px;margin-bottom:36px;flex-wrap:wrap}
  .sn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 6px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);font-size:12px;letter-spacing:.06em;transition:background .2s var(--ease)}
  .sn b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--card-2);font-weight:600;font-size:11px}
  .sn.done{cursor:pointer}
  .sn.done:hover{background:var(--card-2)}
  .sn.done b{background:var(--hl-soft);color:var(--hl)}
  .sn.on{border-color:var(--hl)}
  .sn.on b{background:var(--hl);color:#000}
  .sn[disabled]{opacity:.45;cursor:default}
  .sn .val{opacity:.7;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;
    color:var(--hl);background:var(--hl-soft);padding:6px 12px;border-radius:999px;margin-bottom:18px}
  .kicker i{width:7px;height:7px;border-radius:50%;background:var(--hl)}
  .subtitle{font-size:14px;margin-bottom:10px}
  h1{font-weight:300;font-size:56px;line-height:1.2;text-transform:uppercase;letter-spacing:.05em;color:var(--title);margin-bottom:2.5rem;overflow-wrap:anywhere}
  sup{font-size:.6em;line-height:0}
  h1 sup{font-size:.4em;vertical-align:super;margin-left:2px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px}
  .sec-h{font-weight:400;font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--hl);margin:0 0 14px}
  .block{margin-top:34px}

  /* Kacheln (Ofen, Material) */
  .mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .mat{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 22px 18px;transition:transform .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease);min-height:150px}
  .mat:hover{background:#232325;border-color:rgba(150,178,0,.5)}
  .mat:active{transform:scale(.98)}
  .mat.last{border-color:var(--hl)}
  .mat:focus-visible,.pc:focus-visible,.opt:focus-visible,.sn:focus-visible,.cta:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
  .mat .nm{font-weight:300;font-size:24px;line-height:1.15;letter-spacing:.04em;text-transform:uppercase}
  .mat .nm.long{font-size:19px}
  .mat .tmp{font-size:13px;color:var(--hl)}
  .mat .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px}
  .mat .foot .arr{width:28px;height:28px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;flex:none}
  .arr svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:10.5px;letter-spacing:.06em;background:var(--card-2);border-radius:8px;padding:3px 8px;opacity:.9}
  .flag{position:absolute;top:14px;right:14px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--hl)}

  /* Schritt 3: Arbeit */
  .q{margin-bottom:30px}
  .q h2{font-weight:400;font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--hl);margin-bottom:4px}
  .q p.hint{font-size:12px;opacity:.7;margin-bottom:12px}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .opt{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
    transition:background .2s var(--ease),border-color .2s var(--ease)}
  .opt:hover{background:#232325}
  .opt b{font-weight:400;font-size:15px}
  .opt small{font-size:11px;opacity:.7}
  .opt.on{border-color:var(--hl);background:var(--hl-soft)}
  .opt.on b{color:var(--hl)}
  .opt-ic{display:block;color:#D9D9D6;margin:2px 0 8px}
  .w-ic{display:block;width:100%;max-width:170px;height:52px}
  .cta{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 24px;border-radius:999px;background:var(--hl);color:#000;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;font-size:12px;transition:opacity .2s var(--ease)}
  .cta[disabled]{opacity:.3;cursor:default}
  .cta svg{width:14px;height:14px;stroke:#000;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* Schritt 4: Empfehlung */
  .rec{border-color:var(--hl);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center}
  .badge{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;padding:4px 10px;border-radius:999px;background:var(--hl);color:#000;font-weight:600}
  .rec .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.14em;opacity:.7;margin-top:16px}
  .rec .sel{font-weight:300;font-size:40px;line-height:1.1;letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
  .rec .sel small{display:block;font-size:13px;text-transform:none;letter-spacing:.05em;opacity:.7;margin-top:4px}
  .rec .why{margin-top:14px;font-size:13px}
  .rec .why b{color:var(--hl);font-weight:400}
  .rec .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .rec .facts div{background:var(--card-2);border-radius:14px;padding:12px 14px;min-width:0}
  .rec .facts b{display:block;font-weight:300;font-size:22px;color:var(--hl);white-space:nowrap}
  .rec .facts span{font-size:10.5px;opacity:.7;text-transform:uppercase;letter-spacing:.1em}
  .rec .spark{grid-column:1/-1;height:56px}

  .pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .pc{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:18px 18px 14px;transition:transform .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease)}
  .pc:hover{background:#232325;border-color:rgba(150,178,0,.5)}
  .pc:active{transform:scale(.985)}
  .pc.cur{box-shadow:inset 0 0 0 1px var(--hl);border-color:var(--hl)}
  .pc.no{opacity:.5}
  .pc.no:hover{opacity:.8}
  .pc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .pc .sp{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--hl)}
  .pc.no .sp{color:#fff}
  .pc .pn{display:block;font-size:11.5px;opacity:.8;margin-top:2px}
  .pc .big{display:block;font-weight:300;font-size:28px;line-height:1.05;letter-spacing:.03em}
  .pc .big small{font-size:13px;margin-left:3px;opacity:.8}
  .pc .st{font-size:11px;line-height:1.45}
  .pc .st.ok{color:var(--hl)}
  .pc .st.bad{opacity:.9}
  .mini{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
  .mini.rec-b{background:var(--hl);color:#000;font-weight:600}
  .mini.alt-b{background:var(--hl-soft);color:var(--hl)}
  .spark{width:100%;height:40px;display:block}
  .spark path.l{fill:none;stroke:var(--hl);stroke-width:1.8;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .spark path.a{fill:url(#sf)}
  .pc.no .spark path.l{stroke:#8E8E93}

  /* Kurve */
  .curve-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .curve-h h2{font-weight:300;font-size:26px;letter-spacing:.04em;text-transform:uppercase}
  .curve-h span{font-size:12px;opacity:.7}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:var(--card-2);border-radius:16px;padding:14px 16px;min-width:0}
  .kpi b{display:block;font-weight:300;font-size:26px;line-height:1.1;letter-spacing:.03em;color:var(--hl);white-space:nowrap}
  .kpi span{font-size:11px;opacity:.8}

  .chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:6px}
  .chart-wrap{position:relative;min-width:560px}
  @media (max-width:640px){ .chart-wrap{min-width:0} .chart-scroll{overflow:visible} .swipe{display:none!important} }
  .swipe{display:none;font-size:11px;opacity:.7;margin-top:6px;text-align:center}
  @media (max-width:600px){.swipe{display:block}}
  svg.chart{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
  .grid line{stroke:rgba(255,255,255,.08);stroke-width:1}
  .axis text{fill:#fff;font-size:11px;letter-spacing:.03em;font-family:inherit}
  .axis .ttl{opacity:.7}
  .curve{fill:none;stroke:var(--hl);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .area{fill:url(#fade)}
  .pt{fill:var(--card);stroke:var(--hl);stroke-width:2}
  .lab{fill:#fff;font-size:11px;font-family:inherit}
  .lab.hl{fill:var(--hl);font-weight:600}
  .band{fill:rgba(255,255,255,0);transition:fill .15s var(--ease)}
  .band.on{fill:rgba(255,255,255,.06)}
  .sg{fill:none;stroke:var(--hl);stroke-width:6;stroke-linecap:round;opacity:0;transition:opacity .15s var(--ease)}
  .sg.on{opacity:1}
  svg.chart .curve,svg.chart .pt{transition:opacity .15s var(--ease)}
  svg.chart.active .curve{opacity:.45}
  .tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-100%);margin-top:-14px;
    background:rgba(44,44,46,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;line-height:1.45;white-space:nowrap;
    box-shadow:0 8px 24px rgba(0,0,0,.5);transition:opacity .12s;z-index:2}
  .tip.on{opacity:1}
  .tip.below{transform:translate(-50%,0);margin-top:0}
  .tip b{display:block;font-weight:600}
  .tip .tw{opacity:.7}

  table.steps{width:100%;border-collapse:collapse;margin-top:22px;font-size:13px}
  table.steps th{text-align:left;font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.12em;padding:0 10px 10px;border-bottom:1px solid var(--line)}
  table.steps td{padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.steps tr:last-child td{border-bottom:0}
  table.steps .hl{color:var(--hl)}
  table.steps td.n{opacity:.6;font-size:11px}
  table.steps tbody tr{cursor:pointer;transition:background .15s var(--ease)}
  table.steps tbody tr.on{background:var(--hl-soft)}
  table.steps tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--hl)}
  .ph-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
  .ph-heat{background:var(--hl)} .ph-hold{background:#fff} .ph-cool{background:#5E5E62}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

  .note{display:flex;gap:12px;align-items:flex-start;margin-top:16px;background:var(--card-2);border-radius:16px;padding:14px 16px;font-size:12px}
  .note.warn{background:var(--warn-soft)}
  .note svg{flex:none;width:18px;height:18px;margin-top:1px;stroke:var(--hl);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .note.warn svg{stroke:var(--warn)}
  .legend{margin-top:40px;font-size:11.5px;line-height:1.9;opacity:.75}
  .legend b{font-weight:600}
  footer{margin-top:28px;font-size:11px;text-align:center;opacity:.6}

  /* Ofenbilder */
  .ov-img{display:flex;justify-content:center;align-items:center;height:150px;background:#000;border-radius:14px;overflow:hidden;flex:none}
  .ov-img img{height:100%;width:auto;display:block}
  .ov-img svg{height:70%;width:auto}
  .mat-img{height:150px}
  .mat-img svg{height:88%;width:auto}
  body.simple .mat.oven .mat-img svg{height:92%}
  body.simple .mat.oven{gap:16px;justify-content:flex-start}
  body.simple .mat.oven .ov-img{height:76px;width:76px;border-radius:12px}
  body.simple .mat.oven .mat-img{height:84px;width:84px;background:none;flex:none}
  body.simple .mat.oven .mat-img svg{height:100%}
  body.simple .mat.oven .nm{flex:1}

  /* Kundenversion */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{height:40px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;transition:background .2s var(--ease)}
  .chip small{opacity:.7;margin-left:6px;font-size:11px}
  .chip:hover{background:var(--card-2)}
  .chip.on{background:var(--hl);color:#000;border-color:var(--hl);font-weight:600}
  .chip.on small{opacity:.8}
  .chip.is-rec{border:2px solid var(--hl)}
  .chip em{font-style:normal;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;margin-left:8px;padding:2px 7px;border-radius:999px;background:var(--hl);color:#000}
  .chip.on em{background:#000;color:var(--hl)}
  .chip em.alt{background:var(--hl-soft);color:var(--hl)}
  .chip.on em.alt{background:#000;color:var(--hl)}
  .sec-h.no-h{color:var(--warn)}
  .cl-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:11px}
  .cl-line span{text-transform:uppercase;letter-spacing:.12em;opacity:.7;margin-right:4px}
  .cl-line i{font-style:normal;padding:3px 10px;border-radius:999px;border:1px solid var(--hl);color:var(--hl)}
  .pdf-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;margin:0 0 16px;border-radius:999px;border:1px solid var(--hl);color:var(--hl);font-size:12px;font-weight:600;letter-spacing:.06em;transition:background .2s var(--ease)}
  .pdf-btn:hover{background:var(--hl-soft)}
  .pdf-btn[disabled]{opacity:.5;cursor:default}
  .pdf-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sp-info{font-size:13px;opacity:.75;margin-top:8px;line-height:1.5}
  #detail .sp-info{margin:-6px 0 16px}
  .chip.av{display:inline-flex;align-items:center;cursor:default}
  .chip.av:hover{background:var(--card)}
  .chip.av.on:hover{background:var(--hl)}
  .chip.av.no:hover{background:transparent}
  .chip .nr{font-style:normal;font-size:10.5px;color:var(--warn);margin-left:8px}
  .chip.no{display:inline-flex;align-items:center;gap:6px;border:1px dashed rgba(224,166,58,.55);background:transparent;color:rgba(255,255,255,.6)}
  .chip.no svg{width:14px;height:14px;stroke:var(--warn);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .chip.no small{margin-left:0}
  .chip.no:hover{background:var(--warn-soft)}
  .chip.no.on{background:var(--warn-soft);color:#fff;border-style:solid;border-color:var(--warn);font-weight:400}
  .chip.no.on svg{stroke:var(--warn)}
  .rec .facts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  body.simple h1{font-size:clamp(28px,6vw,48px);overflow-wrap:normal;word-break:normal;-webkit-hyphens:auto;hyphens:auto}
  body.simple .mat{min-height:0;flex-direction:row;align-items:center;justify-content:space-between;padding:20px 20px}
  body.simple .mat .foot{margin-top:0}
  body.simple .mats{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  body.simple .legend{text-align:center}
  /* Sprachwahl */
  main{position:relative}
  .brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-20px 0 28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .brand{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}
  .zz-logo{display:block;height:40px;width:auto;flex:none}
  .app-name{font-size:26px;line-height:1;font-weight:400;color:#fff;letter-spacing:.01em;white-space:nowrap}
  .app-name b{font-weight:300;color:#fff}
  @media (max-width:640px){ .zz-logo{height:30px} .app-name{font-size:19px} .brand{gap:7px} }
  @media (max-width:420px){ .brand{flex-direction:column;align-items:flex-start;gap:6px} .zz-logo{height:30px} .app-name{font-size:20px} }
  .lang{position:relative;z-index:5;flex:none}
  .lang-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.08em}
  .lang-btn:hover{background:var(--card-2)}
  .lang-btn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.6}
  .lang-menu{display:none;position:absolute;right:0;top:40px;list-style:none;min-width:190px;background:rgba(44,44,46,.97);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .lang.open .lang-menu{display:block;max-height:calc(100vh - 110px);overflow-y:auto}
  .lang-menu button{display:flex;gap:10px;width:100%;padding:8px 10px;border-radius:9px;font-size:13px;-webkit-user-select:none;user-select:none}
  .lang-menu button b{width:22px;font-size:11px;color:var(--hl);font-weight:600;padding-top:1px}
  .lang-menu button:hover{background:var(--card-3)}
  .lang-menu button.on{background:var(--hl-soft)}
  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);opacity:0;background:var(--hl);color:#000;font-weight:600;padding:12px 20px;border-radius:999px;transition:all .35s var(--ease);z-index:20}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media (max-width:640px){ .brandbar{margin:-12px 0 22px;padding-bottom:14px} }

  /* ===== Südtirol-Thema (nur bei Sprache Südtirolerisch) ===== */
  .sdt-band{display:none}
  body.sdt{
    --hl:#D4213D; --hl-soft:rgba(212,33,61,.16); --title:#D9CFBE; --text:#F4EFE6;
    --card:#1C1715; --card-2:#2A221E; --card-3:#3A2F29; --line:rgba(233,225,211,.13);
    background:#0E0B0A
      repeating-linear-gradient(90deg, rgba(233,225,211,.018) 0 2px, transparent 2px 11px);
    color:var(--text);
  }
  body.sdt .sdt-band{display:block;position:relative;height:150px;margin-bottom:-60px;pointer-events:none}
  body.sdt .sdt-band .sdt-flag{height:14px;background:linear-gradient(#F4EFE6 0 50%, #D4213D 50% 100%)}

    {k:"Prettau",   label:"Prettau® Zirkon",                  turbo:"Prettau", short:"Prettau®"},
    {k:"ICE",       label:"ICE Zirkon Translucent",           turbo:"ICE", short:"ICE"},
    {k:"Anatomic Coloured", label:"Anatomic Coloured",        turbo:"Anatomic Coloured"},
    {k:"Zirkon Creative",   label:"Zirkon Creative",          turbo:"Zirkon Creative"},
    {k:"Opaque",    label:"Opaque",                           turbo:"Opaque", prog:true},   // kein Zirkon, sondern Programm für opakes Ergebnis (passt zu allen Zirkonen)
    {k:METAL,       label:"Sinternit",                        turbo:null},
    {k:SPECIAL,     get label(){ return t("special"); },     turbo:null}
  ];
  const MAT = Object.fromEntries(MATS.map(m => [m.k, m]));
  const byLabel = Object.fromEntries(MATS.map(m => [m.label, m.k]));
  const SPEEDS = ["Slow","Standard","Speed","Ultraspeed"];          // langsam → schnell
  const OTHER_ORDER = ["Ceramic Cover","Translucency","Vacuum"];
  // Infotexte wie im Ofen-Display (Schlüssel info_<Geschwindigkeit> bzw. info_<Material>|<Geschwindigkeit> im Wörterbuch)
  // Colour Liquid je Material/Farbe (z. B. Prettau 5)
  const clLine = s => { const m = MAT[s.m]; const l = m && m.cl && s.c && m.cl[s.c]; return l ? `<p class="cl-line"><span>${t("cl")}</span>${l.map(x => `<i>${reg(x)}</i>`).join("")}</p>` : ""; };
  const infoLine = (sp, m, c) => {
    if(c === "w") sp = "Translucency";   // weißes Prettau 5: immer der Weiß-Infotext, egal welches Programm der Ofen nutzt
    const k1 = "info_" + m + "|" + sp, k2 = "info_" + sp;
    const tx = t(k1) !== k1 ? t(k1) : (t(k2) !== k2 ? t(k2) : "");
    return tx ? `<p class="sp-info">${esc(tx)}</p>` : "";
  };

  const wk = (id, cap) => ({id, cap, get t(){ return t("w_" + id); }, get s(){ return t("w_" + id + "_s"); }, get st(){ return t("w_" + id + "_st"); }, get why(){ return t("w_" + id + "_why"); }});
  const WORK = [wk("b3", 3), wk("b5", 2), wk("b6", 1), wk("full", 0)];
  /* ---------- Symbole (Arbeit, Wandstärke, Gewicht, Farbe) ---------- */
  const f2 = v => +v.toFixed(2);
  let icId = 0;
  const ICGRAD = `<defs><linearGradient id="wkg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F2EC"/><stop offset="1" stop-color="#C9C5BB"/></linearGradient></defs>`;
  const icSvg = body => `<svg class="w-ic" viewBox="0 0 120 50" aria-hidden="true" fill="url(#wkg)">${ICGRAD}${body}</svg>`;
  // Brückenglied seitlich: weich gerundet, oben flach gewellt, unten rund (wie gefräste Zirkonbrücke)
  const unitP = (x, y, w, h) => { const P = (a, b) => `${f2(x + a*w)} ${f2(y + b*h)}`;
    return `M${P(0,.42)} C${P(0,.12)} ${P(.12,0)} ${P(.3,.02)} C${P(.42,.03)} ${P(.46,.08)} ${P(.5,.08)} C${P(.54,.08)} ${P(.58,.03)} ${P(.7,.02)} C${P(.88,0)} ${P(1,.12)} ${P(1,.42)} C${P(1,.8)} ${P(.78,1)} ${P(.5,1)} C${P(.22,1)} ${P(0,.8)} ${P(0,.42)} Z`; };
  const unit = (x, y, w, h) => `<path d="${unitP(x, y, w, h)}"/>`;
  // Krone mit Kronenrand (unten gerade) bzw. Frontzahnkrone mit gerader Schneidekante
  const crownP = (x, y, w, h) => { const P = (a, b) => `${f2(x + a*w)} ${f2(y + b*h)}`;
    return `M${P(.02,.4)} C${P(0,.12)} ${P(.12,0)} ${P(.3,.02)} C${P(.42,.03)} ${P(.46,.09)} ${P(.5,.09)} C${P(.54,.09)} ${P(.58,.03)} ${P(.7,.02)} C${P(.88,0)} ${P(1,.12)} ${P(.98,.4)} C${P(.97,.68)} ${P(.92,.88)} ${P(.86,1)} L${P(.14,1)} C${P(.08,.88)} ${P(.03,.68)} ${P(.02,.4)} Z`; };
  const incisorP = (x, y, w, h) => { const P = (a, b) => `${f2(x + a*w)} ${f2(y + b*h)}`;
    return `M${P(.04,.18)} Q${P(.04,0)} ${P(.22,0)} L${P(.78,0)} Q${P(.96,0)} ${P(.96,.18)} C${P(.98,.6)} ${P(.88,.88)} ${P(.8,1)} L${P(.2,1)} C${P(.12,.88)} ${P(.02,.6)} ${P(.04,.18)} Z`; };
  // gerade Brücke: Glieder greifen ineinander, kräftige Verbinder – ein Stück mit Einkerbungen
  const bridge = (cx, ws, hs, ov = 2.2) => {
    const total = ws.reduce((s, w) => s + w, 0) - ov * (ws.length - 1);
    const H = Math.max(...hs), base = 25 + H/2;
    let x = cx - total / 2, s = "", cs = "";
    ws.forEach((w, i) => {
      const h = hs[i], y = base - h;
      s += unit(x, y, w, h);
      if(i < ws.length - 1){ const m = Math.min(h, hs[i+1]); cs += `<rect x="${f2(x + w - 6)}" y="${f2(base - m * .78)}" width="10" height="${f2(m * .5)}" rx="3"/>`; }
      x += w - ov;
    });
    return cs + s;
  };
  // geschwungene Brücke: Glieder auf einem leichten Bogen, zu den Enden kleiner (wirkt räumlich)
  const curvedBridge = n => {
    const us = [...Array(n)].map((_, i) => (i - (n - 1) / 2) / ((n - 1) / 2));
    const ws = us.map(u => 15 * (1 - .3 * Math.abs(u))), hs = us.map(u => 22 * (1 - .3 * Math.abs(u)));
    const total = ws.reduce((s, w) => s + w, 0) - (n - 1);
    let x = 60 - total / 2; const pts = [];
    us.forEach((u, i) => { pts.push({x, w:ws[i], h:hs[i], cy:31 - 13 * u * u}); x += ws[i] - 1; });
    const con = pts.map((q, i) => (i ? "L" : "M") + f2(q.x + q.w / 2) + " " + f2(q.cy + q.h * .02)).join(" ");
    return `<path d="${con}" fill="none" stroke="#DDD9D0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>`
      + pts.map(q => unit(q.x, q.cy - q.h / 2, q.w, q.h)).join("");
  };
  function workIcon(id){
    let body = "";
    if(id === "b3") body = unit(18, 9, 30, 32) + bridge(82, [14, 14.5, 14], [18, 19, 18]);     // Einzelkrone + kleine 3er-Brücke
    if(id === "b5") body = bridge(60, [20, 21, 26, 27], [25, 26, 29, 29]);
    if(id === "b6") body = curvedBridge(8);
    if(id === "full"){
      // Vollzirkulär von oben: Zahnbogen, innen der Sinterfuß (Platte), symmetrisch mit Verbindern angebunden
      const cx = 60, cy = 41, rx = 30, ry = 36, n = 14;
      const E = (t, d) => [cx - (rx - d) * Math.cos(t), cy - (ry - d) * Math.sin(t)];
      let band = "", teeth = "";
      for(let i = 0; i <= 40; i++){ const [x, y] = E(Math.PI * i / 40, 0); band += (i ? " L" : "M") + f2(x) + " " + f2(y); }
      for(let i = 0; i < n; i++){
        const tt = Math.PI * (i + .5) / n, c = Math.abs(i - (n - 1) / 2) / ((n - 1) / 2);
        const [x, y] = E(tt, 0), r = 3.7 + 3 * c * c;
        const ang = Math.atan2(ry * Math.cos(tt), -rx * Math.sin(tt)) * 180 / Math.PI;
        teeth += `<ellipse cx="${f2(x)}" cy="${f2(y)}" rx="${f2(r * .92)}" ry="${f2(r * 1.12)}" transform="rotate(${f2(ang + 90)} ${f2(x)} ${f2(y)})"/>`;
      }
      const pts = [];
      for(let i = 0; i <= 24; i++) pts.push(E(Math.PI * (.1 + .8 * i / 24), 11.5));
      const pl = `M${f2(pts[0][0] - 3)} 49.5 L${pts.map(([x, y]) => f2(x) + " " + f2(y)).join(" L")} L${f2(pts[24][0] + 3)} 49.5 Z`;
      let con = "";
      [.5, .3, .7, .16, .84].forEach(k => { const t = Math.PI * k, [x1, y1] = E(t, 12), [x2, y2] = E(t, 5);
        con += `<line x1="${f2(x1)}" y1="${f2(y1)}" x2="${f2(x2)}" y2="${f2(y2)}"/>`; });
      body = `<g stroke="#B9B5AC" stroke-width="2.2">${con}</g><path d="${pl}" fill="#B9B5AC"/>`
           + `<path d="${band}" fill="none" stroke="#E4E1DA" stroke-width="8.5" stroke-linecap="round"/><g>${teeth}</g>`;
    }
    return icSvg(body);
  }
  // Wandstärke: Molarenkrone im Halbschnitt (rechts aufgeschnitten, schraffiert, innen Hohlraum)
  function halfSection(wt){
    const id = "hs" + (++icId), x = 38, y = 8, w = 44, h = 36, o = crownP(x, y, w, h), inner = crownP(x + wt, y + wt, w - 2*wt, h - wt + 2);
    return `<svg class="w-ic" viewBox="0 0 120 50" aria-hidden="true">${ICGRAD}<defs>
      <pattern id="${id}h" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="3" fill="#FAF9F5"/><line x1="0" y1="0" x2="0" y2="3" stroke="#B9B5AC" stroke-width=".7"/></pattern>
      <clipPath id="${id}c"><rect x="60" y="0" width="60" height="50"/></clipPath></defs>
      <path d="${o}" fill="url(#wkg)"/>
      <g clip-path="url(#${id}c)"><path d="${o}" fill="url(#${id}h)"/><path d="${inner}" class="cav"/></g>
      <line x1="60" y1="${y + 2}" x2="60" y2="${y + h}" stroke="#B9B5AC" stroke-width=".6"/></svg>`;
  }
  // Gewicht: Krone wächst mit (Frontzahn → Prämolar → Molar → großer Molar)
  function growCrown(i){
    const [w, h] = [[14,18],[20,24],[30,30],[40,36]][i], x = 60 - w/2, y = 44 - h;
    return icSvg(`<path d="${i === 0 ? incisorP(x, y, w, h) : crownP(x, y, w, h)}"/>`);
  }
  // Prettau 5: Krone eingefärbt (natürlicher Verlauf) bzw. weiß
  function shadeCrown(col){
    const id = "sc" + (++icId);
    const g = col ? `<stop offset="0" stop-color="#F6F1E6"/><stop offset=".45" stop-color="#EBD9B8"/><stop offset="1" stop-color="#D2A86C"/>`
                  : `<stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6E6E2"/>`;
    return `<svg class="w-ic" viewBox="0 0 120 50" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${g}</linearGradient></defs><path d="${crownP(43, 7, 34, 38)}" fill="url(#${id})"/></svg>`;
  }
  const COLOUR_IC = {f:shadeCrown(true), w:shadeCrown(false)};
  WORK.forEach(w => w.icon = workIcon(w.id));
  const WALL = [
    {id:"0", get t(){ return t("wall_no"); },  get s(){ return t("wall_no_s"); },  st:"< 4 mm", icon:halfSection(2.2)},
    {id:"1", get t(){ return t("wall_yes"); }, get s(){ return t("wall_yes_s"); }, st:"> 4 mm", icon:halfSection(13)}
  ];
  const WEIGHT = [1,2,3,4].map(n => ({id:String(n), idx:4-n, get t(){ return t("g" + n); }, get s(){ return t("g" + n + "_s"); }, icon:growCrown(n - 1)}));
  const find = (arr, id) => arr.find(x => x.id === id);

  /* ---------- Programme aufbereiten ---------- */
  function prep(p){
    const pts = [[0, p.temps[0]]]; let t = 0;
    p.durs.forEach((d,i) => { t += d; pts.push([t, p.temps[i+1]]); });
    const maxT = Math.max(...p.temps);
    const holdMax = p.durs.reduce((s,d,i) => s + (p.phases[i]==="hold" && p.temps[i]===maxT ? d : 0), 0);
    const heat = p.rates.filter((r,i) => p.phases[i]==="heat");
    return Object.assign(p, {pts, total:t, maxT, holdMax, maxHeat: heat.length ? Math.max(...heat) : 0, endT:p.temps[p.temps.length-1]});
  }
  const PROGS = [];
  DATA.turbo.forEach(p => {
    let mat = null, speed = null;
    if(/^(Calibrationfire|Cleaning|Wax Burnout)/i.test(p.name)){ mat = SPECIAL; speed = p.name; }
    else {
      for(const sp of ["Ultraspeed","Speed","Slow","Standard","Translucency","Ceramic Cover"]){
        const m = p.name.match(new RegExp("^(.*?)\\s+" + sp + "$", "i"));
        if(m){ mat = m[1]; speed = sp; break; }
      }
      if(!mat){ mat = p.name; speed = "Standard"; }           // z. B. "Opaque"
      mat = (MATS.find(x => x.turbo === mat) || {}).k;
    }
    if(!mat) return;
    PROGS.push(prep(Object.assign({}, p, {id:"t"+p.nr, group:"turbo", mats:[mat], speed})));
  });
  DATA.old.forEach(p => {
    const mats = p.used.map(u => byLabel[u]).filter(Boolean);
    const speed = mats[0] === METAL ? "Metal Sintering" : p.speed;
    PROGS.push(prep(Object.assign({}, p, {id:"o"+p.nr, group:"old", mats, speed})));
  });
  PROGS.forEach(p => { if(p.mats[0] === OPQ) p.speed = OPQ; });
  const byId = Object.fromEntries(PROGS.map(p => [p.id, p]));

  // Zuordnung Zirkon/Geschwindigkeit → Programm je Ofen kommt aus dem Excel-Blatt "Program Assignment"
  // c = Farbe bei Prettau 5: "f" = mit Farbe (Standard), "w" = ohne Farbe/weiß
  const progsFor = (o, m, c) => {
    if(m === SPECIAL) return OV[o].group === "turbo" ? PROGS.filter(p => p.mats.includes(SPECIAL)).map(p => Object.assign({}, p, {key:p.id})) : [];
    // Vacuum-Programme (nur 700 Ultra-Vakuum, Altlasten) werden nicht angezeigt
    const key = MAT[m].colour ? (c === "w" ? MAT[m].wkey : MAT[m].akey) : MAT[m].label;
    return ((DATA.assign[o] || {})[key] || []).filter(a => a.speed !== "Vacuum").map(a => Object.assign({}, byId[a.id], {speed:a.speed, key:a.speed}));
  };
  const matsFor = o => MATS.filter(m => !m.prog && (progsFor(o, m.k).length || progsFor(o, m.k, "w").length));
  // Opaque-Programm des Ofens (für jedes Zirkon wählbar, eigener Schlüssel, damit es nicht mit "Standard" kollidiert)
  const opqFor = (o, m) => { if(m === SPECIAL || m === METAL) return null;
    const p = progsFor(o, OPQ)[0]; return p ? Object.assign({}, p, {key:OPQ, speed:OPQ}) : null; };
  const progName = p => titleCase(p.name).replace(/^Prettau(?!®)/, "Prettau®");
  const selectText = (p, o) => OV[o].byNumber ? {big:t("prog_n", {n:DATA.slots[o][p.nr]}), small:progName(p)} : {big:progName(p), small:""};
  const sIdx = s => SPEEDS.indexOf(s);

  /* ---------- Helfer ---------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const reg = s => esc(s).replace(/®/g, "<sup>®</sup>");
  const titleCase = s => s === s.toUpperCase() ? s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).replace(/\bIce\b/g,"ICE") : s;
  const num = (v, d=1) => Number(v).toLocaleString(LOCALE[LANG], {maximumFractionDigits:d});
  const dur = m => { m = Math.round(m); if(m < 60) return m + " min"; const h = Math.floor(m/60), r = m%60; return r ? `${h} h ${String(r).padStart(2,"0")} min` : `${h} h`; };
  const durShort = m => { m = Math.round(m); const h = Math.floor(m/60), r = m%60; return h ? `${h}<small>h</small> ${String(r).padStart(2,"0")}<small>min</small>` : `${r}<small>min</small>`; };
  const rate = r => (r > 0 ? "+" : r < 0 ? "−" : "") + num(Math.abs(r)) + " °C/min";
  const tempRange = list => { const u = [...new Set(list)].sort((a,b)=>a-b); return u.length > 1 ? `${u[0]}–${u[u.length-1]} °C` : `${u[0]} °C`; };
  const ARROW = `<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>`;
  const INFO = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>`;
  const WARN = `<svg viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17v.01"/></svg>`;
  const PH = ph => t("ph_" + ph);
  const store = {get(){ try{ return localStorage.getItem("zz-sinter-oven"); }catch(e){ return null; } },
                 set(v){ try{ localStorage.setItem("zz-sinter-oven", v); }catch(e){} }};

  function spark(p, cls=""){
    const W=100, H=30, xs = t => t/p.total*W, ys = v => H - v/1700*H;
    const d = p.pts.map((q,i)=>(i?"L":"M")+xs(q[0]).toFixed(2)+","+ys(q[1]).toFixed(2)).join(" ");
    return `<svg class="spark ${cls}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <path class="a" d="${d} L${W},${H} L0,${H} Z"/><path class="l" d="${d}"/></svg>`;
  }

  /* ---------- Empfehlung ---------- */
  function recommend(s){
    const list = progsFor(s.o, s.m, s.c);
    if(s.m === SPECIAL) return {list, rec:null, notes:[]};
    if(s.m === METAL) return {list, rec:list[0], why:t("metal_why"), notes:[], allowed:{[list[0].key]:true}};
    if(MAT[s.m].colour && s.c === "w") return {list, rec:list[0], why:t("white_why"), notes:[], allowed:Object.fromEntries(list.map(p => [p.key, true])), reason:{}, alt:{}, speedProgs:list};
    const work = find(WORK, s.w), full = s.w === "full";
    const caps = [{idx:work.cap, why:work.why}];

    const notes = [];
    let rec = speedProgs.filter(p => sIdx(p.speed) <= target).pop();
    if(!rec && speedProgs.length){

    }

    });

    list.filter(p => p.speed === "Ceramic Cover" || p.speed === "Translucency").forEach(p => { allowed[p.key] = true; if(full && p.speed === "Ceramic Cover") alt[p.key] = true; });
    // Wandstärke über 4 mm: Translucency als Alternative hervorheben (laut Ofen-Display für Wandstärken über 4 mm)
    if(!full && s.t === "1" && s.m !== "Prettau 5") list.filter(p => p.speed === "Translucency").forEach(p => { alt[p.key] = true; });

    if(!limiting.length) limiting = caps.filter(c => c.idx === target).map(c => c.why);
    let why = "";
    if(rec){
      const ri = sIdx(rec.speed);
      if(ri === target) why = t("why_fit", {sp:`<b>${rec.speed}</b>`, lim:limiting.join(" " + t("and") + " ")});
      else if(ri < target) why = t("why_avail", {sp:`<b>${rec.speed}</b>`, t:SPEEDS[target], lim:limiting.join(" " + t("and") + " ")});
      else why = t("why_slowest", {sp:`<b>${rec.speed}</b>`});
    }
    return {list, rec, why, notes, allowed, reason, alt, speedProgs};
  }

  /* ---------- Routing ---------- */
  function readState(){
    const q = new URLSearchParams(location.hash.slice(1));
    if(q.has("lib")) return {lib:true, p:LIBK[q.get("p")] ? q.get("p") : null, v:q.get("v"), f:LIB_OVENS.includes(q.get("f")) ? q.get("f") : null,
      sel:q.get("sel") === "1", cmp:[...new Set((q.get("cmp") || "").split(","))].filter(k => LIBK[k]).slice(0, 4)};
    const s = {o:q.get("o"), m:q.get("m"), w:q.get("w"), t:q.get("t"), g:q.get("g"), p:q.get("p"), r:q.get("r"), c:q.get("c")};
    if(!OV[s.o]) return {};
    if(s.m && !matsFor(s.o).some(m => m.k === s.m)) s.m = null;
    if(!s.m){ return {o:s.o}; }
    if(!find(WORK, s.w)) s.w = null;
    if(!find(WALL, s.t)) s.t = null;
    if(!find(WEIGHT, s.g)) s.g = null;
    const direct = s.m === SPECIAL || s.m === METAL;
    const colour = !!MAT[s.m].colour;
    if(!colour || !["f","w"].includes(s.c)) s.c = colour ? null : null;
    s.complete = direct || (colour && s.c === "w") || ((!colour || s.c) && ((s.w === "full") || (s.w && s.t && s.g)));
    s.r = s.complete && (direct || s.r === "1");
    if(s.p && !(s.p === OPQ && opqFor(s.o, s.m)) && !progsFor(s.o, s.m, s.c).some(p => p.key === s.p)) s.p = null;
    return s;
  }
  function hashOf(s){
    const q = new URLSearchParams();
    ["o","m","c","w","t","g","r","p"].forEach(k => { if(s[k]) q.set(k, k === "r" ? "1" : s[k]); });
    return "#" + q.toString();
  }
  function go(s, replace){
    const h = hashOf(s);
    if(replace){ history.replaceState(null, "", h); render(false); return; }
    if(h !== location.hash) location.hash = h; else render(true);
  }
  window.addEventListener("hashchange", () => render(true));

  /* ---------- Render ---------- */
  const nav = document.getElementById("nav"), view = document.getElementById("view");

  function renderNav(s){
    const direct = s.m === SPECIAL || s.m === METAL;
    const step = s.r ? 4 : s.m ? 3 : s.o ? 2 : 1;
    const workVal = direct ? "—" : (s.m && MAT[s.m].colour && s.c === "w") ? t("c_w") : s.w ? find(WORK, s.w).st : "";
    const items = [
      {n:1, t:t("step_oven"),     v: s.o ? OV[s.o].name.replace("Zirkonofen ","") : "", to:{}},
      {n:2, t:t("step_mat"),   v: s.m ? (MAT[s.m].short || MAT[s.m].label) : "", to:{o:s.o}},
      {n:3, t:t("step_work"),   v: s.r ? workVal : "", to: direct ? null : {o:s.o, m:s.m, c:s.c, w:s.w, t:s.t, g:s.g}},
      {n:4, t:t("step_prog"), v:"", to:null}
    ];
    nav.innerHTML = items.map(i => {
      const skip = i.n === 3 && direct && step === 4;
      const cls = skip ? "" : i.n < step ? "done" : i.n === step ? "on" : "";
      const dis = (i.n > step || skip) ? "disabled" : "";
      return `<button class="sn ${cls}" data-n="${i.n}" ${dis} ${i.n===step?'aria-current="step"':''}><b>${i.n < step && !skip ? "✓" : i.n}</b>${i.t}${i.v ? `<span class="val">· ${esc(i.v)}</span>` : ""}</button>`;
    }).join("");
    nav.querySelectorAll(".sn.done").forEach(b => b.addEventListener("click", () => go(items[b.dataset.n-1].to)));
  }

  function header(step, sub, title, extra=""){
    if(SIMPLE) return `<header class="reveal"><h1>${title}</h1></header>`;
    return `<header class="reveal">
      <div class="kicker"><i></i><span>${t("step_of", {n:step})}${extra ? " · " + extra : ""}</span></div>
      <p class="subtitle">${sub}</p>
      <h1>${title}</h1>
    </header>`;
  }

  function renderOvens(){
    document.title = "Zirkonzahn.SinteringProgram";
    const last = store.get();
    if(SIMPLE){
      view.innerHTML = header(1, "", t("h_oven_s")) + `<div class="mats reveal-2">${OVENS.map(o => `
        <button class="mat oven ${o.id===last?"last":""}" data-o="${o.id}">${ovImg(o)}<span class="nm">${esc(o.name.replace("Zirkonofen ",""))}</span>
        <span class="foot"><span></span><span class="arr">${ARROW}</span></span></button>`).join("")}</div>`;
      view.querySelectorAll(".mat").forEach(b => b.addEventListener("click", () => { store.set(b.dataset.o); go({o:b.dataset.o}); }));
      return;
    }
    view.innerHTML = header(1, t("q_oven"), t("h_oven_s"), t("step_oven")) + `
      <div class="mats reveal-2">${OVENS.map(o => {
        const n = matsFor(o.id).filter(m => m.k !== SPECIAL).length;
        return `<button class="mat oven ${o.id===last?"last":""}" data-o="${o.id}">
          ${ovImg(o)}
          ${o.id===last ? `<span class="flag">${t("last")}</span>` : ""}
          <span class="nm">${esc(o.name.replace("Zirkonofen ",""))}</span>
          <span class="tmp">${o.group === "other" ? t("other_maker") : "Zirkonofen"}</span>
          <span class="foot"><span>${o.sub ? esc(o.sub) + " · " : ""}${t("n_mats", {n})}</span><span class="arr">${ARROW}</span></span>
        </button>`;
      }).join("")}</div>`;
    view.querySelectorAll(".mat").forEach(b => b.addEventListener("click", () => { store.set(b.dataset.o); go({o:b.dataset.o}); }));
  }

  function renderMaterials(s){
    document.title = "Zirkonzahn.SinteringProgram";
    if(SIMPLE){
      view.innerHTML = header(2, "", t("h_mat_s")) + `<div class="mats reveal-2">${matsFor(s.o).filter(m => m.k !== SPECIAL).map(m => `
        <button class="mat oven" data-m="${esc(m.k)}">${matImg(m)}<span class="nm">${reg(m.label)}</span>
        <span class="foot"><span></span><span class="arr">${ARROW}</span></span></button>`).join("")}</div>`;
      view.querySelectorAll(".mat").forEach(b => b.addEventListener("click", () => go({o:s.o, m:b.dataset.m})));
      return;
    }
    view.innerHTML = header(2, `${esc(OV[s.o].name)} · ${t("q_mat")}`, t("h_mat"), t("step_mat")) + `
      <div class="mats reveal-2">${matsFor(s.o).map(m => {
        const list = progsFor(s.o, m.k);
        const ord = x => sIdx(x) >= 0 ? sIdx(x) : 9 + OTHER_ORDER.indexOf(x);
        const sp = [...new Set(list.map(p => p.speed))].sort((a,b) => ord(a) - ord(b));
        const temps = list.filter(p => p.maxT >= 1100).map(p => p.maxT);
        return `<button class="mat oven" data-m="${esc(m.k)}">
          ${matImg(m)}
          <span class="nm">${reg(m.label)}</span>
          <span class="tmp">${m.k === SPECIAL ? t("special_desc") : tempRange(temps)}</span>
          ${m.k === SPECIAL ? "" : `<span class="tags">${sp.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</span>`}
          <span class="foot"><span>${list.length === 1 ? t("n_prog1") : t("n_progs", {n:list.length})}</span><span class="arr">${ARROW}</span></span>
        </button>`;
      }).join("")}</div>`;
    view.querySelectorAll(".mat").forEach(b => b.addEventListener("click", () => go({o:s.o, m:b.dataset.m})));
  }

  function renderWork(s){
    document.title = "Zirkonzahn.SinteringProgram";
    const group = (key, title, hint, opts) => `
      <section class="q">
        <h2>${title}</h2>${SIMPLE ? "" : `<p class="hint">${hint}</p>`}
        <div class="opts" role="radiogroup" aria-label="${esc(title)}">${opts.map(o => `
          <button class="opt ${s[key]===o.id?"on":""}" role="radio" aria-checked="${s[key]===o.id}" data-k="${key}" data-v="${o.id}">
            ${o.icon ? `<span class="opt-ic">${o.icon}</span>` : ""}<b>${esc(SIMPLE && o.st || o.t)}</b>${SIMPLE ? "" : `<small>${esc(o.s)}</small>`}</button>`).join("")}</div>
      </section>`;
    view.innerHTML = header(3, `${esc(OV[s.o].name)} · ${reg(MAT[s.m].label)}`, SIMPLE ? reg(MAT[s.m].label) : t("h_work"), t("step_work")) + `
      <div class="reveal-2">
        ${MAT[s.m].colour ? group("c", t("q_color"), "", [{id:"f", t:t("c_f"), s:t("c_f_s"), st:t("c_f"), icon:COLOUR_IC.f}, {id:"w", t:t("c_w"), s:t("c_w_s"), st:t("c_w"), icon:COLOUR_IC.w}]) : ""}
        <div class="note" id="whiteNote" style="margin:-10px 0 30px" hidden>${INFO}<span>${t("white_note")}</span></div>
        <div id="workQ">${group("w", t("q_work"), t("hint_work"), WORK)}</div>
        <div class="note" id="fullNote" style="margin:-10px 0 30px">${INFO}<span>${t("full_note")}</span></div>
        <div id="moreQ">
        ${group("t", SIMPLE ? t("q_wall_s") : t("q_wall"), t("hint_wall"), WALL)}
        ${group("g", t("q_weight"), t("hint_weight"), WEIGHT)}
        </div>
        <section class="q"><h2>${t("avail")}</h2>${SIMPLE ? "" : `<p class="hint">${t("hint_avail")}</p>`}<div class="pgrid" id="avail"></div>
          ${opqFor(s.o, s.m) ? `<p class="opq-h">${t("opq_q")}</p><div class="pgrid" id="availOpq"></div>` : ""}</section>
        <button class="cta" id="cta">${t("cta")} ${ARROW}</button>
      </div>`;
    const ordP = p => sIdx(p.speed) >= 0 ? sIdx(p.speed) : 9 + OTHER_ORDER.indexOf(p.speed);
    const renderAvail = () => {
      const avail = progsFor(s.o, s.m, s.c).sort((a,b) => ordP(a) - ordP(b));
      const full = s.w === "full", caps = [], white = !!MAT[s.m].colour && s.c === "w";
      if(s.w && !white) caps.push({idx:find(WORK, s.w).cap, why:find(WORK, s.w).why});
      if(s.w && !full){
        if(s.g) caps.push({idx:find(WEIGHT, s.g).idx, why:t("why_weight", {w:find(WEIGHT, s.g).t})});
        if(s.t === "1") caps.push({idx:1, why:t("why_wall")});
      } else if(!s.w && !white){
        if(s.g) caps.push({idx:find(WEIGHT, s.g).idx, why:t("why_weight", {w:find(WEIGHT, s.g).t})});
        if(s.t === "1") caps.push({idx:1, why:t("why_wall")});
      }
      const R = s.complete ? recommend(s) : null;
      view.querySelector("#avail").innerHTML = avail.map(p => {
        const i = sIdx(p.speed);
        const isRec = R && R.rec && R.rec.key === p.key;
        let lim = i >= 0 ? caps.filter(c => i > c.idx) : [];
        if(isRec) lim = [];
        const no = lim.length > 0;
        const why = no ? t("not_rec_r", {r:lim.map(c => c.why).join(", ")}) : "";
        const cls = isRec ? "is-rec" : no ? "no" : s.complete ? "fit" : "";
        const stt = isRec ? t("rec_badge") : no ? t("nr_small") : s.complete ? t("fit_small") : "";
        return `<div class="ptile ${cls}" title="${esc(why)}"><b>${esc(p.speed)}</b><i>${dur(p.total)}</i><em>${stt ? esc(stt) : "&nbsp;"}</em></div>`;
      }).join("");
      const oq = opqFor(s.o, s.m), oe = view.querySelector("#availOpq");
      if(oq && oe) oe.innerHTML = `<div class="ptile ${s.complete ? "fit" : ""}" title="${esc(t("info_Opaque"))}"><b>${esc(oq.speed)}</b><i>${dur(oq.total)}</i><em>${s.complete ? esc(t("fit_small")) : "&nbsp;"}</em></div>`;
    };
    // Auswahl ohne Neuaufbau der Seite: nur Markierungen, Sichtbarkeit und Button aktualisieren
    const cta = view.querySelector("#cta");
    const sync = () => {
      const full = s.w === "full";
      const colour = !!MAT[s.m].colour, white = colour && s.c === "w";
      s.complete = colour && !s.c ? false : white ? true : !!(s.w && (full || (s.t && s.g)));
      view.querySelector("#fullNote").hidden = SIMPLE || !full || white;
      view.querySelector("#whiteNote").hidden = !white;
      view.querySelector("#workQ").hidden = white;
      view.querySelector("#moreQ").hidden = full || white;
      cta.disabled = !s.complete;
      renderAvail();
      view.querySelectorAll(".opt").forEach(b => {
        const on = s[b.dataset.k] === b.dataset.v;
        b.classList.toggle("on", on); b.setAttribute("aria-checked", on);
      });
    };
    sync();
    view.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      s[b.dataset.k] = b.dataset.v; s.r = null; s.p = null;
      history.replaceState(null, "", hashOf(s));
      sync(); renderNav(s);
    }));
    cta.addEventListener("click", () => { if(s.complete) go(Object.assign({}, s, {r:"1", p:null})); });
  }

  function progCard(p, s, R){
    const sel = selectText(p, s.o);
    const isRec = R.rec && p.key === R.rec.key, isAlt = R.alt && R.alt[p.key];
    const no = R.reason && R.reason[p.key];
    const cur = (s.p || (R.rec && R.rec.key) || (R.list[0] && R.list[0].key)) === p.key;
    return `<button class="pc ${no?"no":""} ${cur?"cur":""}" data-p="${esc(p.key)}" aria-pressed="${cur}">
      <span class="top"><span><span class="sp">${esc(p.speed)}</span><span class="pn">${reg(sel.big)}</span></span>
        ${isRec ? `<span class="mini rec-b">${t("rec_badge")}</span>` : isAlt ? `<span class="mini alt-b">${t("alt_badge")}</span>` : ""}</span>
      <span class="big">${durShort(p.total)}</span>
      ${spark(p)}
      ${no ? `<span class="st bad">${esc(no)}</span>` : (R.allowed && R.allowed[p.key] && !isRec ? `<span class="st ok">${t("ok")}</span>` : `<span class="st">${p.maxT} °C · ${t("ph_hold")} ${dur(p.holdMax)}</span>`)}
    </button>`;
  }

  function renderResult(s){
    const R = recommend(s);
    if(s.o === "other" && R.rec) R.notes.push({t:t("other_note")});
    const m = MAT[s.m], o = OV[s.o];
    document.title = "Zirkonzahn.SinteringProgram";
    const work = find(WORK, s.w);
    let sub = esc(o.name);
    if(MAT[s.m].colour && s.c) sub += " · " + esc(t(s.c === "w" ? "c_w" : "c_f"));
    if(work && !(MAT[s.m].colour && s.c === "w")) sub += " · " + esc(work.t) + (s.w !== "full" ? ` · ${find(WEIGHT, s.g).t} · ${s.t==="1" ? t("why_wall") : t("wall_upto")}` : "");
    const shown = R.list.find(p => p.key === s.p) || R.rec || R.list[0];
    if(SIMPLE) return renderSimpleResult(s, R, shown);
    let recHtml = "";
    if(R.rec){
      const sel = selectText(R.rec, s.o);
      recHtml = `<section class="card rec reveal-2">
        <div>
          <span class="badge">${t("rec_prog")}</span>
          <p class="lbl">${s.o === "other" ? t("program") : t("select_at")}</p>
          <p class="sel">${reg(sel.big)}${sel.small ? `<small>${reg(sel.small)}</small>` : ""}</p>
          ${infoLine(R.rec.speed, s.m, s.c)}${clLine(s)}
          <p class="why">${R.why}</p>
        </div>
        <div class="facts">
          <div><b>${dur(R.rec.total)}</b><span>${t("dur")}</span></div>
          <div><b>${R.rec.maxT} °C</b><span>${t("endtemp_s")}</span></div>
          <div><b>${dur(R.rec.holdMax)}</b><span>${t("hold")}</span></div>
          ${spark(R.rec)}
        </div>
      </section>
      ${R.notes.map(n => `<div class="note ${n.warn?"warn":""}">${n.warn?WARN:INFO}<span>${esc(n.t)}</span></div>`).join("")}`;
    }
    const speedList = (R.speedProgs || []);
    const others = R.list.filter(p => !speedList.includes(p)).sort((a,b) => OTHER_ORDER.indexOf(a.speed) - OTHER_ORDER.indexOf(b.speed));
    const sec = (title, list, hint="") => list.length ? `<section class="block reveal-3">
      <h2 class="sec-h">${title}</h2>${hint ? `<p class="desc" style="font-size:12px;opacity:.7;margin:-8px 0 14px">${hint}</p>` : ""}
      <div class="pcs">${list.map(p => progCard(p, s, R)).join("")}</div></section>` : "";
    const showAll = s.m === SPECIAL || s.m === METAL;
    view.innerHTML = header(4, sub, reg(m.label), t("step_prog")) + recHtml
      + (showAll ? sec(s.m === SPECIAL ? t("programs") : t("program"), R.list)
                 : sec(t("all_speeds"), speedList, t("tap_hint")) + sec(t("more_progs"), others))
      + `<section class="card block" id="detail"></section>`;
    view.querySelectorAll(".pc").forEach(b => b.addEventListener("click", () => {
      history.replaceState(null, "", hashOf(Object.assign({}, s, {p:b.dataset.p})));
      view.querySelectorAll(".pc").forEach(x => { const on = x === b; x.classList.toggle("cur", on); x.setAttribute("aria-pressed", on); });
      renderDetail(R.list.find(p => p.key === b.dataset.p), s);
      document.getElementById("detail").scrollIntoView({behavior:"smooth", block:"start"});
    }));
    renderDetail(shown, s);
  }

  /* ---------- Kundenversion: Ergebnis ---------- */
  function renderSimpleResult(s, R, shown){
    const m = MAT[s.m], rec = R.rec;
    document.title = "Zirkonzahn.SinteringProgram";
    const ord = p => sIdx(p.speed) >= 0 ? sIdx(p.speed) : 9 + OTHER_ORDER.indexOf(p.speed);
    const isAlt = p => !!(R.alt && R.alt[p.key]);
    const alts = R.list.filter(p => rec && p.key !== rec.key && R.allowed && R.allowed[p.key]).sort((a,b) => (isAlt(b) - isAlt(a)) || (ord(a) - ord(b)));
    const chips = rec ? [rec, ...alts] : R.list;
    const notRec = R.list.filter(p => R.reason && R.reason[p.key]).sort((a,b) => ord(a) - ord(b));
    const sel = rec ? selectText(rec, s.o) : null;
    const opq = opqFor(s.o, s.m);
    if(opq && s.p === OPQ) shown = opq;
    view.innerHTML = header(4, "", reg(m.label))
      + (rec ? `<section class="card rec reveal-2">
          <div><p class="lbl" style="margin-top:0">${s.o === "other" ? t("rec_prog") : t("select_at")}</p>
          <p class="sel">${reg(sel.big)}</p>${infoLine(rec.speed, s.m, s.c)}${clLine(s)}${R.why ? `<details class="why-d"><summary>${t("why_q")}</summary><p>${R.why}</p></details>` : ""}</div>
          <div class="facts two"><div><b>${dur(rec.total)}</b><span>${t("dur")}</span></div><div><b>${rec.maxT} °C</b><span>${t("temp")}</span></div></div>
        </section>` : "")
      + (R.notes.some(n => n.warn) ? `<div class="note warn">${WARN}<span>${t("warn_simple")}</span></div>` : "")
      + (chips.length > 1 ? `<section class="block reveal-3"><h2 class="sec-h">${rec ? t("fitting") : t("programs")}</h2>
          <div class="chips">${chips.map(p => `<button class="chip ${p === shown ? "on" : ""} ${p === rec ? "is-rec" : ""}" data-p="${esc(p.key)}">${esc(p.speed)} <small>${dur(p.total)}</small>${p === rec ? `<em>${t("rec_badge")}</em>` : isAlt(p) ? `<em class="alt">${t("alt_badge")}</em>` : ""}</button>`).join("")}</div></section>` : "")
      + (notRec.length ? `<section class="block reveal-3"><h2 class="sec-h no-h">${t("not_rec")}</h2>
          <div class="chips">${notRec.map(p => `<button class="chip no ${p === shown ? "on" : ""}" data-p="${esc(p.key)}" title="${esc(R.reason[p.key])}">${WARN}${esc(p.speed)} <small>${dur(p.total)}</small></button>`).join("")}</div></section>` : "")
      + (opq ? `<section class="block reveal-3"><h2 class="sec-h">${t("opq_q")}</h2>
          <div class="chips"><button class="chip ${opq === shown ? "on" : ""}" data-p="${OPQ}">${esc(opq.speed)} <small>${dur(opq.total)}</small></button></div></section>` : "")
      + `<section class="card block" id="detail"></section>`;
    const show = p => {
      renderDetail(p, s);
      if(R.reason && R.reason[p.key]) document.getElementById("detail").insertAdjacentHTML("afterbegin",
        `<div class="note warn" style="margin:0 0 18px">${WARN}<span><b>${t("not_rec")}</b> ${t("not_rec_detail", {r:esc(R.reason[p.key].replace(t("not_rec_r", {r:""}), ""))})}</span></div>`);
    };
    view.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      history.replaceState(null, "", hashOf(Object.assign({}, s, {p:b.dataset.p})));
      view.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
      show(b.dataset.p === OPQ ? opq : R.list.find(p => p.key === b.dataset.p));
    }));
    show(shown);
  }

  function renderDetail(p, s, opts = {}){
    const el = document.getElementById("detail");
    const rows = p.durs.map((d,i) => {
      const t0 = p.temps[i], t1 = p.temps[i+1], ph = p.phases[i];
      return `<tr><td class="n">${i+1}</td><td><span class="ph-dot ph-${ph}"></span>${PH(ph)}</td>
        <td>${t0===t1 ? t0+" °C" : `${t0} → ${t1} °C`}</td><td>${ph==="hold" ? "—" : rate(p.rates[i])}</td>
        <td class="${ph==="hold"?"hl":""}">${num(d)} min</td></tr>`;
    }).join("");
    const notes = [];
    if(p.endT > 30) notes.push(t("end_note", {t:p.endT}));
    const o = OV[s.o];
    const nr = o && o.byNumber && DATA.slots[s.o] && DATA.slots[s.o][p.nr] != null ? t("prog_n", {n:DATA.slots[s.o][p.nr]}) : "";
    const title = opts.title || reg(progName(p));
    const info = opts.info != null ? opts.info : infoLine(p.speed, s.m, s.c);
    el.innerHTML = `<div class="dhead"><div class="dleft"><h2>${title}</h2>${nr ? `<p class="pnum">${esc(nr)}</p>` : ""}${info}${opts.extra || ""}</div>
        <div class="dright"><b class="dur">${dur(p.total)}</b><span class="sub">${t("kpi_end")} ${p.maxT} °C</span>
          <div class="pend"><span class="lb">${t("start")}</span><span class="stepper"><button type="button" data-d="-15" aria-label="-15 min">−</button><input id="startIn" type="text" inputmode="numeric" autocomplete="off" aria-label="${esc(t("start"))}"><button type="button" data-d="15" aria-label="+15 min">+</button></span><span class="pe-r"><span class="lb">→ ${t("prog_end")}</span> <b class="end" id="endAt"></b></span></div>
        </div></div>
      <div class="chart-scroll"><div class="chart-wrap"><svg class="chart" id="chart" viewBox="0 0 760 380" role="img"></svg><div class="tip" id="tip"></div></div></div>
      <div class="tbl-wrap"><table class="steps"><thead><tr><th>#</th><th>${t("th_phase")}</th><th>${t("th_temp")}</th><th>${t("th_rate")}</th><th>${t("th_dur")}</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${notes.map(n => `<div class="note">${INFO}<span>${esc(n)}</span></div>`).join("")}
      ${opts.noPdf ? "" : `<button class="pdf-btn" id="pdfBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>${t("pdf_btn")}</button>`}`;
    if(!opts.noPdf) el.querySelector("#pdfBtn").onclick = () => exportPdf(p, s, opts.pdf);
    bindEnd(el, p);
    lastCmp = null;
    drawChart(p);
  }

  /* ---------- Programmende (Startzeit verstellbar) ---------- */
  let startAt = null, endTimer = null;   // null = jetzt
  const hhmm = d => d.toLocaleTimeString(LOCALE[LANG], {hour:"2-digit", minute:"2-digit"});
  function bindEnd(el, p){
    const inp = el.querySelector("#startIn"), out = el.querySelector("#endAt");
    if(!inp || !out) return;
    const day = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const upd = () => {
      const now = new Date(), st = startAt != null ? new Date(startAt) : now;
      if(document.activeElement !== inp) inp.value = startAt != null ? hhmm(st) : t("now");
      const e = new Date(st.getTime() + p.total * 60000), dd = Math.round((day(e) - day(now)) / 864e5);
      out.innerHTML = esc(hhmm(e)) + (dd === 1 ? ` <small>(${esc(t("tomorrow"))})</small>` : dd > 1 ? ` <small>(+${dd})</small>` : "");
    };
    el.querySelectorAll(".stepper button").forEach(b => b.onclick = () => {
      let base = startAt;
      if(base == null){ const n = new Date(); n.setSeconds(0, 0); n.setMinutes(Math.floor(n.getMinutes() / 15) * 15); base = n.getTime(); }
      startAt = base + (+b.dataset.d) * 60000; upd();
    });
    inp.onfocus = () => inp.select();
    inp.onchange = () => {
      const m = inp.value.trim().match(/^(\d{1,2})[:.h]?(\d{2})$/);
      if(m && +m[1] < 24 && +m[2] < 60){ const d = new Date(); d.setHours(+m[1], +m[2], 0, 0); startAt = d.getTime(); } else startAt = null;
      upd();
    };
    inp.onkeydown = ev => { if(ev.key === "Enter") inp.blur(); };
    upd();
    clearInterval(endTimer);

  }

  // PDF-Standardschrift kennt nur westeuropäische Zeichen → polnische/tschechische Sonderbuchstaben vereinfachen (ł→l, ř→r …)
  const PDF_MAP = {"ł":"l","Ł":"L","đ":"d","Đ":"D"};

  function pdfAxes(doc, cx, cy, cw, ch, total){

    doc.text("°C", cx - 2, cy - 3, {align:"right"}); doc.text(pdfTxt(t("axis_time")), cx + cw, cy + ch + 10, {align:"right"});

    h += `<path class="curve" d="${d}" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.22,.61,.36,1) .15s forwards"/>`;
    P.forEach(q => h += `<circle class="pt" cx="${x(q[0])}" cy="${y(q[1])}" r="${P.length>10?3:4}"/>`);
    p.durs.forEach((dd,i) => {
      if(p.phases[i] !== "hold" || dd < 5) return;
      const cx = Math.min(Math.max(x(P[i][0] + dd/2), L+52), W-R-52), cy = y(p.temps[i]);
      h += `<text class="lab hl" x="${cx}" y="${cy-26}" text-anchor="middle">${t("chart_hold", {d:num(dd)})}</text>`;
      h += `<text class="lab" x="${cx}" y="${cy-12}" text-anchor="middle">${p.temps[i]} °C</text>`;
    });
    h += segs + `</g>`;
    h += `<rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>`;
    svg.innerHTML = h;
    svg.setAttribute("aria-label", t("aria_curve", {n:p.name}) + ": " + p.durs.map((dd,i)=>`${PH(p.phases[i])} ${p.temps[i]} → ${p.temps[i+1]} °C, ${num(dd)} min`).join("; ") + ". " + t("aria_total", {d:dur(p.total)}) + ".");

    const segAt = t => { for(let i=1;i<P.length;i++) if(t <= P[i][0]) return i-1; return P.length-2; };
    const rowsEl = [...document.querySelectorAll("table.steps tbody tr")];
    let cur = -1;
    function show(i){
      if(i === cur) return;
      cur = i;
      svg.classList.toggle("active", i >= 0);
      svg.querySelectorAll(".band,.sg").forEach(el => el.classList.toggle("on", +el.dataset.i === i));
      rowsEl.forEach((r,k) => r.classList.toggle("on", k === i));
      if(i < 0){ tip.classList.remove("on"); return; }
      const t0 = P[i][0], t1 = P[i+1][0], v0 = P[i][1], v1 = P[i+1][1], ph = p.phases[i];
      tip.innerHTML = `<b>${i+1} · ${PH(ph)}</b>`
        + `${v0===v1 ? v0+" °C" : `${v0} → ${v1} °C`}${ph==="hold" ? "" : " · " + rate(p.rates[i])}<br>`
        + `${num(p.durs[i])} min <span class="tw">(${num(t0)} – ${num(t1)} min)</span>`;
      const r = svg.getBoundingClientRect();
      const tw = tip.offsetWidth || 180;
      let left = ((x(t0)+x(t1))/2) / W * r.width;
      left = Math.max(tw/2 + 4, Math.min(r.width - tw/2 - 4, left));
      tip.style.left = left + "px";
      const topPx = y(Math.max(v0,v1)) / H * r.height, th = tip.offsetHeight || 70;
      const below = topPx - th - 16 < 0;
      tip.classList.toggle("below", below);
      tip.style.top = (below ? topPx + 16 : topPx) + "px";
      tip.classList.add("on");
    }
    function move(ev){
      const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * W;
      const t = (sx - L) / (W-L-R) * TMAX;
      show(t < 0 || t > p.total ? -1 : segAt(t));
    }
    const hit = svg.querySelector("#hit");
    hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
    hit.addEventListener("pointerleave", ev => { if(ev.pointerType === "mouse") show(-1); });
    rowsEl.forEach((r,k) => {
      r.addEventListener("mouseenter", () => show(k));
      r.addEventListener("mouseleave", () => show(-1));
      r.addEventListener("click", () => show(cur === k ? -1 : k));
    });
  }
  const st = document.createElement("style");
  st.textContent = "@keyframes draw{to{stroke-dashoffset:0}} @media (prefers-reduced-motion:reduce){.curve{stroke-dashoffset:0!important}}";
  document.head.appendChild(st);

  /* ---------- Sprachwahl, Legende, Fußzeile ---------- */
  const langEl = document.getElementById("lang");
  document.getElementById("brand").addEventListener("click", ev => { ev.preventDefault(); go({}); });
  let sdtClicks = 0, sdtTimer = null;
  function setLang(l){
    // andere Sprache gewählt → Südtirolerisch verschwindet wieder aus dem Menü
    if(l !== "sdt" && !/[?&]lang=sdt\b/.test(location.search)) sdtUnlocked = false;
    LANG = l; ls.set("zz-lang", l === "sdt" ? "de" : l);
    render(false);
  }
  function toast(msg){
    const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.classList.add("on"), 10);
    setTimeout(() => { el.classList.remove("on"); setTimeout(() => el.remove(), 400); }, 2600);
  }
  function renderChrome(){
    document.documentElement.lang = LANG === "sdt" ? "de" : LANG === "no" ? "nb" : LANG;
    document.body.classList.toggle("sdt", LANG === "sdt");
    const list = sdtUnlocked ? [...LANGS, SDT] : LANGS;
    const cur = list.find(x => x[0] === LANG) || LANGS[0];
    const open = langEl.classList.contains("open");
    langEl.innerHTML = `<button class="lang-btn" aria-haspopup="listbox" aria-expanded="${open}" aria-label="${esc(t("lang"))}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 2.6 15.2 0 18M12 3c-2.6 2.8-2.6 15.2 0 18"/></svg>${cur[2]}</button>
      <ul class="lang-menu" role="listbox">${list.map(x => `<li><button role="option" aria-selected="${x[0]===LANG}" class="${x[0]===LANG?"on":""}" data-l="${x[0]}"><b>${x[2]}</b>${esc(x[1])}</button></li>`).join("")}</ul>`;
    langEl.querySelector(".lang-btn").addEventListener("click", ev => { ev.stopPropagation(); langEl.classList.toggle("open"); langEl.querySelector(".lang-btn").setAttribute("aria-expanded", langEl.classList.contains("open")); });
    langEl.querySelectorAll(".lang-menu button").forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      const l = b.dataset.l;
      // Trick: dreimal schnell hintereinander auf "Deutsch" tippen → Südtirolerisch
      if(l === "de" && !sdtUnlocked){
        sdtClicks++; clearTimeout(sdtTimer); sdtTimer = setTimeout(() => sdtClicks = 0, 1500);
        if(sdtClicks >= 3){ sdtClicks = 0; sdtUnlocked = true; langEl.classList.remove("open"); setLang("sdt"); toast(t("sdt_toast")); return; }
        if(LANG !== "de") setLang("de");
        return;
      }
      langEl.classList.remove("open");
      if(l !== LANG) setLang(l); else renderChrome();
    }));
    const lg = document.getElementById("legend"), ft = document.getElementById("footer");
    const stand = DATA.stand ? new Date(DATA.stand + "T12:00:00").toLocaleDateString(LOCALE[LANG]) : "";
    lg.innerHTML = esc(t("disclaimer")) + (stand ? ` · ${esc(t("data_stand"))}: ${esc(stand)}` : "");
    if(LANG === "sdt") lg.insertAdjacentHTML("beforeend", `<span class="sdt-sign">${esc(t("sdt_sign"))}</span>`);
    ft.innerHTML = "";
    document.getElementById("libTxt").textContent = t("lib");
    document.getElementById("libBtn").classList.toggle("on", /^#lib(&|$)/.test(location.hash));
  }
  document.addEventListener("click", () => { if(langEl.classList.contains("open")){ langEl.classList.remove("open"); renderChrome(); } });

  // Bibliothek: bleibt man in derselben Ansicht (Übersicht / Programm / Vergleich),
  // nur Inhalt tauschen – keine Einblend-Animation, kein Sprung nach oben
  let lastLibView = null, lastMainHash = "";
  // „Alle Programme“ nochmal antippen → zurück dorthin, wo man vorher war
  document.getElementById("libBtn").addEventListener("click", ev => {
    if(!/^#lib(&|$)/.test(location.hash)) return;
    ev.preventDefault();
    location.hash = lastMainHash || "#";
  });
  function render(scroll){
    renderChrome();
    const s = readState();
    if(!s.lib) lastMainHash = location.hash.length > 1 ? location.hash : "";
    const lv = s.lib ? (s.v === "cmp" && s.cmp.length >= 2 ? "cmp" : s.p ? "p" : "list") : null;
    const same = lv !== null && lv === lastLibView;
    lastLibView = lv;
    view.classList.toggle("still", same);
    if(s.lib){ nav.innerHTML = ""; renderLib(s); if(scroll && !same) window.scrollTo({top:0, behavior:"smooth"}); return; }
    renderNav(s);
    if(s.r) renderResult(s); else if(s.m) renderWork(s); else if(s.o) renderMaterials(s); else renderOvens();
    if(scroll) window.scrollTo({top:0, behavior:"smooth"});
  }
  render(false);
})();
</script>
</body>
</html>
